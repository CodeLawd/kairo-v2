[package]
name = "soak"
version.workspace = true
edition.workspace = true
publish = false
description = "Scripted service soak with chaos events against the real kairo-engine (prompt 108)"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
kairo-core = { path = "../../crates/kairo-core" }
kairo-domain = { path = "../../crates/kairo-domain" }
kairo-engine-proto = { path = "../../crates/kairo-engine-proto" }
kairo-net = { path = "../../crates/kairo-net" }
kairo-stt = { path = "../../crates/kairo-stt" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3"
