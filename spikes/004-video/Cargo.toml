[package]
name = "kairo-spike-video"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
ffmpeg-next = { version = "=8.1.0", default-features = false, features = ["codec", "format", "software-scaling"] }
libc = "0.2"
pollster = "0.4"
wgpu = "=30.0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
