[package]
name = "engine-window-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway spike: its own workspace keeps these dependencies out of the app.
[workspace]

[dependencies]
gpui-kit = "=0.9.0"
winit = "0.30"
wgpu = "30"
interprocess = "2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
bincode = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
libc = "0.2"
image = { version = "0.25", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSRunningApplication", "NSWorkspace", "NSResponder"] }
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFString", "CFBase"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVBuffer", "CVImageBuffer", "CVReturn"] }
