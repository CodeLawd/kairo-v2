[package]
name = "kairo"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
gpui-kit.workspace = true
kairo-core = { path = "../../crates/kairo-core" }
kairo-engine-proto = { path = "../../crates/kairo-engine-proto" }
kairo-domain = { path = "../../crates/kairo-domain" }
kairo-store = { path = "../../crates/kairo-store" }
kairo-ui-kit = { path = "../../crates/kairo-ui-kit" }
ui-web = { path = "../../crates/ui-web" }
ui-shell = { path = "../../crates/ui-shell" }
ui-operator = { path = "../../crates/ui-operator" }
ui-scripture = { path = "../../crates/ui-scripture" }
ui-lyrics = { path = "../../crates/ui-lyrics" }
ui-account = { path = "../../crates/ui-account" }
ui-settings = { path = "../../crates/ui-settings" }
futures-channel = "0.3"
iana-time-zone = "0.1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
kairo-audio = { path = "../../crates/kairo-audio" }
kairo-cloud = { path = "../../crates/kairo-cloud" }
kairo-orchestrator = { path = "../../crates/kairo-orchestrator" }
kairo-lyrics = { path = "../../crates/kairo-lyrics" }
kairo-media = { path = "../../crates/kairo-media" }
kairo-scripture = { path = "../../crates/kairo-scripture" }
kairo-stt = { path = "../../crates/kairo-stt" }
kairo-output = { path = "../../crates/kairo-output" }
kairo-audience = { path = "../../crates/kairo-audience" }
kairo-updater = { path = "../../crates/kairo-updater" }
kairo-documents = { path = "../../crates/kairo-documents" }
kairo-transfer = { path = "../../crates/kairo-transfer" }
kairo-native-sys = { path = "../../crates/kairo-native-sys" }
kairo-net = { path = "../../crates/kairo-net" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSImage", "NSResponder", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSView", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSArray", "NSURL", "NSString", "NSNotification", "NSOperation"] }

[dev-dependencies]
tempfile = "3"
kairo-output = { path = "../../crates/kairo-output", features = ["fake"] }

[features]
# Test-only launch hooks (`KAIRO_OPEN_SETTINGS`). Never enable in a shipped build.
dev-hooks = []
