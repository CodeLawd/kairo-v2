name: CI

on:
  push:
    # Run on all branches, not on tag pushes: release tags are checked by
    # release-native.yml, so `kairo-release prepare` pushing main + tag won't
    # trigger a duplicate CI run.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  # The release workflow runs these checks on the tag it releases (prompt 104).
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check
        type: string
        required: false
        default: ""
      mode:
        description: Check scope (full, or bridge-only for fast tag releases)
        type: string
        required: false
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ !inputs.ref && (github.event_name == 'push' || github.event_name == 'pull_request') }}

env:
  # Full debug info for the whole workspace fills the Linux runner's disk
  # (the linker died with SIGBUS). Line tables keep test backtraces useful.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  bridge-contract:
    name: Electron bridge validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout native
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout deployed Electron reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CodeLawd/kairo-presenter
          ref: af978c5159f4d433dc93b2de7a8f92f92765b74e
          path: .bridge-electron
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install deployed updater test runtime
        # No Electron binary, app install scripts, or changes to the shipping repo.
        run: |
          npm install --prefix .bridge-runtime --ignore-scripts --no-audit --no-fund --no-package-lock electron-updater@6.8.9
          ln -s "$GITHUB_WORKSPACE/.bridge-runtime/node_modules" .bridge-electron/node_modules

      - name: Check bridge contracts and negative cases
        env:
          BRIDGE_ELECTRON: .bridge-electron
        run: node --test packaging/bridge/check-electron-bridge.test.mjs

  workspace:
    name: Workspace (${{ matrix.os }})
    if: inputs.mode != 'bridge-only'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Self-hosted runner setup
        # The build output is kept between runs, outside the checkout (which
        # is cleaned each run), and trimmed so the Mac's disk stays bounded.
        if: runner.environment == 'self-hosted'
        run: |
          dir="$HOME/.kairo-ci/target/${{ github.job }}"
          packaging/ci/trim-runner-cache.sh "$dir" 40
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> "$GITHUB_ENV"

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          wait

      - name: Install GPUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ clang lld nasm libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev vulkan-validationlayers libvulkan1 \
            mesa-vulkan-drivers libva-drm2 >/dev/null
          echo "RUSTFLAGS=-C linker=clang -C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"

      # FFmpeg 9 shared libraries (DECISIONS: kairo-media links FFmpeg).
      # `ffmpeg-sys-next` reads `FFMPEG_DIR`; tests need the DLLs/.so files
      # at run time and the `ffmpeg` command for poster fixtures.
      - name: Install FFmpeg 9 (macOS)
        if: runner.os == 'macOS'
        # Already installed on the self-hosted Mac: left as it is.
        run: brew list --versions ffmpeg pkgconf >/dev/null || brew install ffmpeg pkgconf

      - name: Install FFmpeg 9 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-lgpl-shared-9.0.tar.xz
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"

      # rav1d (AV1 pictures, prompt 053) assembles its x86-64 code with nasm.
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install FFmpeg 9 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg-n9.0-latest-win64-lgpl-shared-9.0'
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Join-Path $dir 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure fast linker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command lld-link -ErrorAction SilentlyContinue) {
            'RUSTFLAGS=-C linker=lld-link' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Select workspace Rust toolchain
        shell: bash
        run: packaging/ci/install-toolchain.sh --profile minimal --component rustfmt --component clippy

      - name: Install cargo-nextest
        shell: bash
        run: |
          if command -v cargo-nextest >/dev/null 2>&1; then
            exit 0
          fi
          case "${{ runner.os }}" in
            Linux)   target=linux ;;
            macOS)   target=mac ;;
            Windows) target=windows-tar ;;
          esac
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL --retry 3 "https://get.nexte.st/latest/$target" | tar -xz -C "$HOME/.cargo/bin"
          if command -v cygpath >/dev/null 2>&1; then
            cygpath -w "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci-workspace-${{ matrix.os }}
          cache-on-failure: true

      - name: Lint workspace
        # The soak driver uses POSIX signals and process inspection.
        run: cargo clippy --locked --workspace ${{ runner.os == 'Windows' && '--exclude soak' || '' }} --all-targets -- -D warnings

      - name: Test workspace
        # Compositor goldens run on lavapipe (Linux) and WARP (Windows) and
        # must not skip there. Hosted macOS runners may have no GPU; the
        # self-hosted Mac has one, and its own timing.
        shell: bash
        env:
          KAIRO_REQUIRE_GPU: ${{ (runner.os != 'macOS' || runner.environment == 'self-hosted') && '1' || '' }}
          KAIRO_PERF_HOSTED: ${{ (runner.os != 'Linux' && runner.environment == 'github-hosted') && '1' || '0' }}
        run: |
          exclude=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            exclude=(--exclude soak)
          fi
          cargo nextest run --locked --workspace "${exclude[@]}" --no-fail-fast
          cargo test --doc --locked --workspace "${exclude[@]}"

  performance:
    # Prompt 107: budgets from 06-testing-performance-strategy.md, asserted as
    # written on an optimised build (KAIRO_PERF_STRICT). Apple silicon is the
    # baseline machine class; other runners run the same tests unoptimised
    # with four times the budget inside the workspace job.
    name: Performance budgets (macos-15)
    if: inputs.mode != 'bridge-only'
    runs-on: macos-15
    env:
      KAIRO_PERF_STRICT: "1"
      # Release builds refuse to compile without https API URLs; these tests
      # make no requests.
      KAIRO_API_URL: https://api.example.com
      KAIRO_WEB_URL: https://example.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Self-hosted runner setup
        # The build output is kept between runs, outside the checkout (which
        # is cleaned each run), and trimmed so the Mac's disk stays bounded.
        if: runner.environment == 'self-hosted'
        run: |
          dir="$HOME/.kairo-ci/target/${{ github.job }}"
          packaging/ci/trim-runner-cache.sh "$dir" 20
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> "$GITHUB_ENV"

      - name: Select workspace Rust toolchain
        shell: bash
        run: packaging/ci/install-toolchain.sh --profile minimal

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci-perf-macos-15
          cache-on-failure: true

      - name: Slide raster, scripture search and detector budgets
        env:
          KAIRO_PERF_HOSTED: ${{ runner.environment == 'github-hosted' && '1' || '0' }}
        # Timings vary on shared runners: a miss is retried once before it fails.
        shell: bash
        run: |
          budgets() { cargo test --release --locked -p kairo-scene -p kairo-scripture --test perf_budgets -- --nocapture; }
          budgets || { echo "::warning::a performance budget was missed; retrying once"; budgets; }
