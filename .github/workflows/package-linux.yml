name: Package Linux

# Builds and verifies the Linux x64 AppImage and deb (prompt 103), then installs
# them in clean Ubuntu 22.04 and 24.04 containers: from apt with only the deb's
# Depends and no FFmpeg, launch under Xvfb with software rendering, NDI load,
# the no-display and no-driver messages, the AppImage, an upgrade over the
# Electron deb, and a purge (packaging/linux/install-test.sh). Artifacts go to
# workflow storage only; publishing a release is prompt 104's job.
#
# Variables: PROD_API_URL, PROD_WEB_URL, and optionally PROD_AUDIENCE_API_URL
# and LICENSE_PUBLIC_KEY, compiled into the binaries (public values only).

on:
  # Called by release-native.yml (prompt 104), which publishes only when every
  # platform succeeds, or run by hand to build without publishing. No tag
  # trigger: a native release starts only from release-native.yml until 112.
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build
        type: string
        required: false
        default: ""
      fail_for_test:
        description: Dry run only — the job id to fail on purpose
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Linux x64 AppImage and deb
    # The oldest supported release, so glibc and library versions hold on newer ones.
    runs-on: ubuntu-22.04
    environment: release
    timeout-minutes: 120
    env:
      KAIRO_API_URL: ${{ vars.PROD_API_URL }}
      KAIRO_WEB_URL: ${{ vars.PROD_WEB_URL }}
      KAIRO_AUDIENCE_API_URL: ${{ vars.PROD_AUDIENCE_API_URL }}
      KAIRO_LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ runner.temp }}/package/target
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Deliberate failure (release dry run)
        # Proves a failed platform publishes nothing (prompt 104).
        if: inputs.fail_for_test == 'linux'
        run: |
          echo "::error::failing on purpose for the release dry run (fail_for_test=${{ inputs.fail_for_test }})"
          exit 1

      - name: Check production endpoint configuration
        run: |
          test -n "$KAIRO_API_URL" || (echo "::error::PROD_API_URL is not set" && exit 1)
          test -n "$KAIRO_WEB_URL" || (echo "::error::PROD_WEB_URL is not set" && exit 1)
          echo "endpoints: $KAIRO_API_URL / $KAIRO_WEB_URL"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build dependencies
        # Build-time only. No FFmpeg development package: FFmpeg is built from
        # source below, and a system one must not leak into the link.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang make nasm pkg-config patchelf dpkg-dev \
            libva-dev libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev \
            libvulkan-dev libavahi-client3
          if dpkg -l | grep -E '^ii +libav(codec|format|util)-dev' ; then
            echo "::error::a system FFmpeg development package is installed"; exit 1
          fi

      - name: Select Rust toolchain
        shell: bash
        run: packaging/ci/install-toolchain.sh --profile minimal

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Cache the FFmpeg build
        # build-ffmpeg.sh skips a build whose stamp matches (pins and flags), so
        # a restored prefix saves the from-source build. The key covers the same inputs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/package/ffmpeg-x64
          key: ffmpeg-linux-x64-ubuntu-22.04-${{ hashFiles('packaging/common.sh', 'packaging/linux/build-ffmpeg.sh', 'packaging/linux/config.sh') }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: package-linux-x64
          cache-on-failure: true

      - name: FFmpeg (LGPL, from source) and pinned inputs
        run: |
          packaging/linux/build-ffmpeg.sh "$RUNNER_TEMP/package"
          packaging/linux/fetch-inputs.sh "$RUNNER_TEMP/package"

      - name: Package
        run: packaging/linux/package.sh "$RUNNER_TEMP/package"

      - name: Decode tests against the bundled FFmpeg
        # Posters, preview, playback and audio decode through the FFmpeg that
        # ships, by runpath. The distribution's ffmpeg command only makes the
        # test fixtures; it is installed after packaging, so it cannot leak in.
        run: |
          sudo apt-get install -y ffmpeg mesa-vulkan-drivers
          ffmpeg_dir="$RUNNER_TEMP/package/ffmpeg-x64"
          FFMPEG_DIR="$ffmpeg_dir" PKG_CONFIG_PATH="$ffmpeg_dir/lib/pkgconfig" \
            RUSTFLAGS="-C link-arg=-Wl,-rpath,$ffmpeg_dir/lib" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/target-ffmpeg-tests" \
            cargo test --locked -p kairo-media -p kairo-video -p kairo-audio --no-fail-fast

      - name: Upload artifacts (workflow storage only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kairo-linux-x64
          path: |
            ${{ runner.temp }}/package/dist/*.AppImage
            ${{ runner.temp }}/package/dist/*.deb
            ${{ runner.temp }}/package/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 30

  install:
    name: Install test (${{ matrix.image }}${{ matrix.electron && ', over Electron' || '' }})
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04"]
        electron: [false, true]
    steps:
      - name: Tools the test itself needs
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl binutils file >/dev/null

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kairo-linux-x64
          path: dist

      - name: Install, launch, purge
        shell: bash
        run: |
          deb="$(ls dist/kairo-presenter_*_amd64.deb | head -1)"
          appimage="$(ls dist/Kairo-*.AppImage | head -1)"
          chmod +x "$appimage"
          version="$(basename "$deb" | sed 's/^kairo-presenter_\(.*\)_amd64\.deb$/\1/')"
          extra=()
          if [ "${{ matrix.electron }}" = true ]; then
            # The last Electron release (public): 1.0.33.
            curl -fL --retry 3 -o /tmp/kairo-presenter_1.0.33_amd64.deb \
              https://github.com/CodeLawd/kairo-presenter/releases/download/v1.0.33/kairo-presenter_1.0.33_amd64.deb
            extra=(--electron-deb /tmp/kairo-presenter_1.0.33_amd64.deb)
          fi
          packaging/linux/install-test.sh --deb "$deb" --appimage "$appimage" --version "$version" "${extra[@]}"
