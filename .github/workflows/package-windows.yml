          '@
          foreach ($line in $imports -split "\`n") {
            $dll, $symbol = $line.Trim() -split " ",2
            if (-not $symbol) { continue }
            $handle = [IntPtr]::Zero
            if (-not [Runtime.InteropServices.NativeLibrary]::TryLoad($dll, [ref]$handle)) {
              Write-Output "Cannot load $dll for $symbol"
              continue
            }
            $entry = [IntPtr]::Zero
            if (-not [Runtime.InteropServices.NativeLibrary]::TryGetExport($handle,$symbol,[ref]$entry)) {
              Write-Output "Missing $dll $symbol"
            }
            [Runtime.InteropServices.NativeLibrary]::Free($handle)
          }
