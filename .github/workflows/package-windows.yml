name: Windows manifest smoke test
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kairo-windows-x64
          run-id: 45578263293
          github-token: ${{ github.token }}
          path: dist
      - shell: pwsh
        run: |
          $setup = Get-ChildItem dist/Kairo-Setup-*.exe | Select-Object -First 1
          $installer = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode) { throw "Installer exited with $($installer.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs/Kairo'
          $exe = Join-Path $dir 'Kairo.exe'
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/mt.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency><dependentAssembly>
              <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*" />
            </dependentAssembly></dependency>
          </assembly>
          '@ | Set-Content "$env:RUNNER_TEMP/kairo.manifest"
          & $mt.FullName -nologo -manifest "$env:RUNNER_TEMP/kairo.manifest" "-outputresource:$exe;#1"
          if ($LASTEXITCODE) { throw "Manifest tool exited with $LASTEXITCODE" }
          $app = Start-Process $exe -WorkingDirectory $dir -PassThru
          for ($i = 0; $i -lt 45 -and -not $app.HasExited; $i++) {
            if (Get-Process kairo-engine -ErrorAction SilentlyContinue) { 'Engine started'; exit 0 }
            Start-Sleep 1
          }
          Get-Content "$env:APPDATA/Kairo/logs/kairo.log" -Tail 60 -ErrorAction SilentlyContinue
          if ($app.HasExited) { throw "Kairo exited with $($app.ExitCode)" }
          throw 'Kairo ran but engine did not start'
