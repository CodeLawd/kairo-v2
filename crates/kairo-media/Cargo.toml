[package]
name = "kairo-media"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
async-channel = "2"
feruca = "0.13"
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
kairo-domain = { path = "../kairo-domain" }
kairo-store = { path = "../kairo-store" }
png = "0.18"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
trash = "5.3"
tracing = "0.1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSObject"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3.7", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
tempfile = "3"
