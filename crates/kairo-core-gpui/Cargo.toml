[package]
name = "kairo-core-gpui"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
futures-channel = "0.3"
gpui-kit.workspace = true
kairo-core = { path = "../kairo-core" }
futures-util = "0.3"
image = { version = "0.25", default-features = false }
kairo-domain = { path = "../kairo-domain" }
kairo-scene = { path = "../kairo-scene" }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
kairo-engine-proto = { path = "../kairo-engine-proto" }
tokio = { version = "1", features = ["sync"] }
