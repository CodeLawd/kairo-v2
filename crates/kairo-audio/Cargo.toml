[package]
name = "kairo-audio"
version.workspace = true
edition.workspace = true
publish = false

# Program sound: the mixer of video, document video, camera, web and tracks
# sources, the output device chosen by label, the NDI audio tap, and the
# file players behind tracks and the program fallback.
[dependencies]
cpal = "0.18"
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["codec", "format"] }
kairo-domain = { path = "../kairo-domain" }
libc = "0.2"
rtrb = "0.4"
rubato = "5"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
