[package]
name = "ui-operator"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gpui-kit.workspace = true
kairo-core = { path = "../kairo-core" }
kairo-core-gpui = { path = "../kairo-core-gpui" }
kairo-domain = { path = "../kairo-domain" }
kairo-engine-proto = { path = "../kairo-engine-proto" }
kairo-ui-kit = { path = "../kairo-ui-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
kairo-ui-kit = { path = "../kairo-ui-kit", features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
kairo-output = { path = "../kairo-output", features = ["fake"] }
