[package]
name = "ui-shell"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
gpui-kit.workspace = true
kairo-core = { path = "../kairo-core" }
kairo-domain = { path = "../kairo-domain" }
kairo-ui-kit = { path = "../kairo-ui-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
kairo-ui-kit = { path = "../kairo-ui-kit", features = ["test-support"] }
tokio = { version = "1", features = ["rt", "time", "test-util"] }
gpui-kit = { workspace = true, features = ["test-support"] }
