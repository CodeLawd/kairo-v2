[package]
name = "kairo-lyrics"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
icu_collator = "2.4.0"
kairo-domain = { path = "../kairo-domain" }
kairo-store = { path = "../kairo-store" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }
roxmltree = "0.21"
rusqlite = { version = "0.41", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
kairo-oracle = { path = "../kairo-oracle" }
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "macros"] }
futures-lite = "2"
tempfile = "3"
