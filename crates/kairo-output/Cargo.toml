[package]
name = "kairo-output"
version = "0.1.0"
edition.workspace = true
publish = false
description = "The surface manager: which output shows what (prompt 065)."

[features]
# `FakeEngine`, for tests only.
fake = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
kairo-core = { path = "../kairo-core" }
kairo-domain = { path = "../kairo-domain" }
kairo-engine-proto = { path = "../kairo-engine-proto" }
kairo-media = { path = "../kairo-media" }
kairo-orchestrator = { path = "../kairo-orchestrator" }
kairo-store = { path = "../kairo-store" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
kairo-output = { path = ".", features = ["fake"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "macros"] }
