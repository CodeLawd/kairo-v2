[package]
name = "ui-settings"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
futures-channel = "0.3"
futures-util = "0.3"
gpui-kit.workspace = true
kairo-domain = { path = "../kairo-domain" }
kairo-ui-kit = { path = "../kairo-ui-kit" }
serde_json = "1"
tracing = "0.1"
ui-account = { path = "../ui-account" }
ui-shell = { path = "../ui-shell" }

[dev-dependencies]
kairo-ui-kit = { path = "../kairo-ui-kit", features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
