[package]
name = "kairo-scripture"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
kairo-domain = { path = "../kairo-domain" }
kairo-store = { path = "../kairo-store" }
memchr = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-lite = "2"
kairo-oracle = { path = "../kairo-oracle" }
serde = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt"] }
