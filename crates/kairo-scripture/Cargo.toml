[package]
name = "kairo-scripture"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
fancy-regex = "0.20.1"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
kairo-domain = { path = "../kairo-domain" }
kairo-store = { path = "../kairo-store" }
memchr = "2"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }
roxmltree = "0.21"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
futures-lite = "2"
kairo-oracle = { path = "../kairo-oracle" }
serde = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "test-util"] }
