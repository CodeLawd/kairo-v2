[package]
name = "kairo-stt"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
cpal = "0.18"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
kairo-cloud = { path = "../kairo-cloud" }
kairo-domain = { path = "../kairo-domain" }
kairo-net = { path = "../kairo-net" }
ogg = "0.9"
opus-rs = "0.1.42"
rtrb = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "test-util"] }
