[package]
name = "ui-lyrics"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
feruca = "0.13"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gpui-kit.workspace = true
kairo-domain = { path = "../kairo-domain" }
kairo-ui-kit = { path = "../kairo-ui-kit" }
regex = "1"
tracing = "0.1"

[dev-dependencies]
kairo-ui-kit = { path = "../kairo-ui-kit", features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
serde_json = "1"
