[package]
name = "kairo-audience"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
kairo-cloud = { path = "../kairo-cloud" }
kairo-domain = { path = "../kairo-domain" }
kairo-net = { path = "../kairo-net" }
kairo-store = { path = "../kairo-store" }
png = "0.18"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
kairo-oracle = { path = "../kairo-oracle" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
