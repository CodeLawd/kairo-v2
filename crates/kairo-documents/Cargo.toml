[package]
name = "kairo-documents"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
kairo-net = { path = "../kairo-net" }
base64 = "0.22"
fancy-regex = "0.20.1"
feruca = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
kairo-domain = { path = "../kairo-domain" }
kairo-store = { path = "../kairo-store" }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe", "image_latest"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process", "fs", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSData", "NSError", "NSDate", "NSRunLoop", "NSGeometry", "NSValue", "block2", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKPDFConfiguration", "WKNavigation", "WKNavigationDelegate"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[dev-dependencies]
kairo-oracle = { path = "../kairo-oracle" }
ttf-parser = "0.25"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[[test]]
name = "webkit_print"
harness = false
