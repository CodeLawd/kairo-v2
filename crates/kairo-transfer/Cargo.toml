[package]
name = "kairo-transfer"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
kairo-domain = { path = "../kairo-domain" }
kairo-lyrics = { path = "../kairo-lyrics" }
kairo-orchestrator = { path = "../kairo-orchestrator" }
kairo-store = { path = "../kairo-store" }
serde = "1.0.229"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
kairo-oracle = { path = "../kairo-oracle" }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt", "rt-multi-thread", "sync"] }
