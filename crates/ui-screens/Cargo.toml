[package]
name = "ui-screens"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
futures-channel = "0.3"
futures-util = "0.3"
gpui-kit.workspace = true
kairo-core = { path = "../kairo-core" }
kairo-core-gpui = { path = "../kairo-core-gpui" }
kairo-domain = { path = "../kairo-domain" }
kairo-ui-kit = { path = "../kairo-ui-kit" }
serde_json = "1"
serde = "1"
tracing = "0.1"

[dev-dependencies]
kairo-engine-proto = { path = "../kairo-engine-proto" }
kairo-output = { path = "../kairo-output", features = ["fake"] }
gpui-kit = { workspace = true, features = ["test-support"] }
