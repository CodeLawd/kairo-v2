[workspace]
resolver = "2"
members = [
    "apps/kairo",
    "apps/kairo-engine",
    "crates/kairo-domain",
    "crates/kairo-store",
    "crates/kairo-net",
    "crates/kairo-core",
    "crates/kairo-core-gpui",
    "crates/kairo-cloud",
    "crates/kairo-scripture",
    "crates/kairo-stt",
    "crates/kairo-lyrics",
    "crates/kairo-media",
    "crates/kairo-orchestrator",
    "crates/kairo-output",
    "crates/kairo-documents",
    "crates/kairo-audience",
    "crates/kairo-transfer",
    "crates/kairo-updater",
    "crates/kairo-engine-proto",
    "crates/kairo-scene",
    "crates/kairo-compositor",
    "crates/kairo-video",
    "crates/kairo-audio",
    "crates/kairo-camera",
    "crates/kairo-sinks",
    "crates/kairo-oracle",
    "crates/kairo-native-sys",
    "crates/kairo-ui-kit",
    "crates/ui-shell",
    "crates/ui-operator",
    "crates/ui-scripture",
    "crates/ui-lyrics",
    "crates/ui-media",
    "crates/ui-documents",
    "crates/ui-theme",
    "crates/ui-screens",
    "crates/ui-settings",
    "crates/ui-audience",
    "crates/ui-account",
    "crates/ui-web",
    "crates/ui-transfer",
    "crates/ui-capture",
    "tools/check-api-coverage",
    "tools/check-lib-coverage",
    "tools/electron-sync",
    "tools/embed-changelog",
    "tools/ts-oracle",
    "tools/golden-capture",
    "tools/soak",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
gpui-kit = "=0.9.1"

# Slide text is shaped and rasterised on the CPU. Unoptimised, the 480-case
# corpus (prompt 052) takes minutes in `cargo test`, so the crates that do
# that work are optimised in dev and test builds. Nothing else changes.
[profile.dev.package.kairo-scene]
opt-level = 3
[profile.dev.package.parley]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.fontique]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.icu_segmenter]
opt-level = 3
[profile.dev.package.icu_properties]
opt-level = 3
[profile.dev.package.icu_normalizer]
opt-level = 3
[profile.dev.package.rav1d]
opt-level = 3
[profile.dev.package.avif-decode]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.kairo-compositor]
opt-level = 3
# ffmpeg-sys-next's build script (with bindgen) overflows the 1 MiB main
# thread stack on Windows when built without optimisation.
[profile.dev.package.ffmpeg-sys-next]
opt-level = 3

[profile.dev.package.bindgen]
opt-level = 3
