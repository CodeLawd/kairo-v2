[env]
# Build the bundled SQLite as better-sqlite3 (Electron) does: no per-allocation
# memory statistics. Measured in prompt 037: needed for quote search p95 parity.
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0"
# Every GPUI test window builds the AccessKit tree VoiceOver and Narrator read,
# so UI tests can audit it (prompt 106, `kairo_ui_kit::a11y_audit`). GPUI reads
# this only in `test-support` builds; set it to 0 in the shell to turn it off.
GPUI_A11Y_ACTIVE = "1"

# KAIRO_API_URL and KAIRO_WEB_URL are deliberately not set here: local builds
# use the local servers (http://localhost:3000 and :3001, the defaults in
# kairo-store's build_config.rs). Release packaging sets the production URLs
# from the PROD_API_URL and PROD_WEB_URL repository variables. To run a local
# build against production, set both in the shell, for example
# KAIRO_API_URL=https://api.kairopresenter.com KAIRO_WEB_URL=https://kairopresenter.com

# Sign debug `kairo` with a stable identity so the keychain's "Always Allow"
# survives rebuilds (tools/dev-sign-run.sh). Other binaries run unchanged.
[target.aarch64-apple-darwin]
runner = "tools/dev-sign-run.sh"

[target.x86_64-apple-darwin]
runner = "tools/dev-sign-run.sh"
